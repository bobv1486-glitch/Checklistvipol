<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Check-list de Frota - Vipol</title>
    
    <!-- Scripts do Firebase (SDK v9 via compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <!-- Biblioteca jsPDF para geração de relatórios em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { 
            color-scheme: dark; 
            --bg-principal: #0f1117;
            --bg-card: #181c24;
            --bg-input: #12151c;
            --borda-card: #262c38;
            --azul-vipol: #1d4ed8;
            --azul-hover: #2563eb;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --sucesso: #059669;
            --alerta: #d97706;
            --perigo: #dc2626;
        }
        
        html, body {
            background-color: var(--bg-principal) !important;
            color: var(--texto-principal) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 12px; padding-bottom: 120px;
            box-sizing: border-box;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Sistema de Toasts */
        #toast-container {
            position: fixed; top: 64px; right: 14px; left: 14px;
            z-index: 100000; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1e2430; border-left: 4px solid #3b82f6;
            color: #fff; padding: 12px 16px; border-radius: 8px;
            font-size: 13px; font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: auto; transition: opacity 0.3s ease;
        }

        .barra-navegacao-sistema {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(15, 17, 23, 0.95); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--borda-card);
            display: flex; justify-content: center; gap: 8px;
            padding: 10px; z-index: 10000; overflow-x: auto;
        }

        .btn-navegacao {
            background: #181c24; color: var(--texto-secundario);
            border: 1px solid var(--borda-card); padding: 8px 14px;
            font-size: 11px; font-weight: 700; border-radius: 8px;
            cursor: pointer; text-transform: uppercase; white-space: nowrap;
            display: none;
        }

        .btn-navegacao.ativo {
            background: var(--azul-vipol); color: #ffffff; border-color: #3b82f6;
        }

        body { padding-top: 56px; }

        .tela-login, .painel-geral-container, .painel-oficina-container, .area-escala-container {
            display: none;
        }

        .ativo-tela { display: flex !important; flex-direction: column; }

        .box-login {
            background: var(--bg-card); border: 1px solid var(--borda-card);
            border-radius: 16px; padding: 30px 24px; width: 100%;
            max-width: 380px; margin: 40px auto; text-align: center;
        }

        .campo-login { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 14px; }
        .campo-login label { font-size: 11px; font-weight: 700; color: var(--texto-secundario); text-transform: uppercase; }
        .campo-login input, .campo-login select, .campo-login textarea {
            padding: 12px; background: var(--bg-input); border: 1px solid var(--borda-card);
            border-radius: 10px; color: #ffffff; font-size: 14px; outline: none;
        }

        .card-painel {
            background: var(--bg-card); border: 1px solid var(--borda-card);
            border-radius: 12px; padding: 14px; margin-bottom: 15px;
        }

        .titulo-secao {
            font-size: 12px; font-weight: 800; color: #60a5fa;
            text-transform: uppercase; margin-bottom: 8px;
        }

        .btn-acessar {
            width: 100%; background: var(--azul-vipol); color: #ffffff;
            border: none; padding: 14px; font-size: 13px; font-weight: 700;
            border-radius: 10px; cursor: pointer; text-transform: uppercase;
        }

        /* Estilo Recado de Escala */
        .caixa-recado {
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid #d97706;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .btn-logout { background: transparent; color: #f87171; border: 1px solid #f87171; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="barra-navegacao-sistema" id="barra-nav">
        <button class="btn-navegacao" id="tab-escala" onclick="mudarVisao('escala')">📅 Escala</button>
        <button class="btn-navegacao" id="tab-motorista" onclick="mudarVisao('motorista')">📱 Check-list</button>
        <button class="btn-navegacao" id="tab-oficina" onclick="mudarVisao('oficina')">🔧 Oficina</button>
        <button class="btn-navegacao" id="tab-controlador" onclick="mudarVisao('controlador')">📊 Painel</button>
    </div>

    <!-- TELA LOGIN -->
    <div id="tela-login" class="tela-login" style="display: flex;">
        <div class="box-login">
            <h2>Vipol Transportes</h2>
            <p>Sistema de Frota</p>
            <div class="campo-login"><label>Nome</label><input type="text" id="login-nome"></div>
            <div class="campo-login"><label>Matrícula</label><input type="number" id="login-chapa"></div>
            <div class="campo-login">
                <label>Função</label>
                <select id="login-cargo">
                    <option value="motorista">Motorista</option>
                    <option value="escalante">Escalante</option>
                    <option value="oficina">Oficina / Mecânico</option>
                    <option value="controlador">Controlador / Gestor</option>
                </select>
            </div>
            <button class="btn-acessar" onclick="realizarLogin()">Entrar</button>
        </div>
    </div>

    <!-- ÁREA ESCALA -->
    <div id="area-escala" class="area-escala-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div class="titulo">Painel de Escalas</div>
            <button class="btn-logout" onclick="fazerLogout()">Trocar Usuário</button>
        </div>

        <!-- VISÃO MOTORISTA: MINHA ESCALA -->
        <div class="card-painel" id="bloco-minha-escala" style="border-left: 4px solid var(--azul-vipol);">
            <div class="titulo-secao">📋 Minha Próxima Escala</div>
            <div id="dados-minha-escala">Buscando escalas...</div>
            <button onclick="carregarMinhaEscala()" style="margin-top:10px; background:transparent; border:none; color:var(--texto-secundario); font-size:11px; cursor:pointer;">🔄 Atualizar</button>
        </div>

        <!-- VISÃO ESCALANTE: CADASTRAR -->
        <div class="card-painel" id="bloco-cadastro-escala" style="display:none; border-left: 4px solid var(--sucesso);">
            <div class="titulo-secao" style="color: #34d399;">✏️ Lançar Escala</div>
            <div class="campo-login"><label>Matrícula Motorista</label><input type="number" id="escala-chapa"></div>
            <div class="campo-login"><label>Nome Motorista</label><input type="text" id="escala-nome"></div>
            <div class="campo-login"><label>Linha</label><input type="text" id="escala-linha"></div>
            <div class="campo-login"><label>Data</label><input type="date" id="escala-data"></div>
            <div class="campo-login"><label>Horário de Pegada</label><input type="text" id="escala-horario" placeholder="Ex: 04:30"></div>
            <div class="campo-login">
                <label>Observações / Recado para o Motorista</label>
                <textarea id="escala-obs" rows="3" placeholder="Ex: Pegar carro reserva 36.150 na garagem."></textarea>
            </div>
            <button class="btn-acessar" style="background:var(--sucesso);" onclick="salvarEscalaIndividual()">Salvar Escala</button>
        </div>
    </div>

    <!-- ÁREA MOTORISTA: CHECKLIST (Simplificada para o código não ficar gigante) -->
    <div id="area-motorista" style="display:none; padding:10px;">
        <div class="card-painel">
            <div class="titulo-secao">✅ Check-list Diário</div>
            <p style="font-size:12px; color:var(--texto-secundario);">Selecione o prefixo e preencha a vistoria.</p>
            <div class="campo-login"><label>Prefixo</label><input type="text" id="txt-prefixo" placeholder="36.XXX"></div>
            <button class="btn-acessar">Iniciar Vistoria</button>
        </div>
    </div>

    <!-- ÁREA OFICINA E CONTROLADOR (ESTRUTURA BÁSICA) -->
    <div id="painel-oficina" class="painel-oficina-container">
        <div class="card-painel"><div class="titulo-secao">🔧 Módulo Oficina</div><p>Histórico de manutenções.</p></div>
    </div>

    <div id="painel-geral" class="painel-geral-container">
        <div class="card-painel"><div class="titulo-secao">📊 Painel Gestor</div><p>Monitoramento da frota.</p></div>
    </div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAcnlxdhZbAt9wtpVBhtSYGfMmvXBBMkRE",
      authDomain: "checklistvipol.firebaseapp.com",
      projectId: "checklistvipol",
      storageBucket: "checklistvipol.firebasestorage.app",
      messagingSenderId: "1083183148599",
      appId: "1:1083183148599:web:c3f6fcc48a72a8f03719b2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let usuarioChapaAtivo = "";
    let usuarioCargoAtivo = "";

    function mostrarToast(msg, tipo) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = tipo === 'sucesso' ? '#059669' : '#d97706';
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function realizarLogin() {
        const nome = document.getElementById("login-nome").value;
        const chapa = document.getElementById("login-chapa").value;
        const cargo = document.getElementById("login-cargo").value;

        if(!nome || !chapa) return alert("Preencha Nome e Matrícula!");

        localStorage.setItem("vipol_chapa", chapa);
        localStorage.setItem("vipol_cargo", cargo);
        localStorage.setItem("vipol_nome", nome);
        
        verificarSessao();
    }

    function verificarSessao() {
        const chapa = localStorage.getItem("vipol_chapa");
        const cargo = localStorage.getItem("vipol_cargo");

        if(chapa) {
            usuarioChapaAtivo = String(chapa); // Garantir String
            usuarioCargoAtivo = cargo;
            document.getElementById("tela-login").style.display = "none";
            document.querySelectorAll(".btn-navegacao").forEach(b => b.style.display = "inline-block");

            if(cargo === 'motorista') {
                mudarVisao('escala');
            } else if(cargo === 'escalante') {
                mudarVisao('escala');
                document.getElementById('bloco-cadastro-escala').style.display = 'block';
                document.getElementById('bloco-minha-escala').style.display = 'none';
            } else if(cargo === 'oficina') {
                mudarVisao('oficina');
            } else {
                mudarVisao('controlador');
            }
        }
    }

    function mudarVisao(modo) {
        document.querySelectorAll('.btn-navegacao').forEach(b => b.classList.remove('ativo'));
        document.querySelectorAll('.area-escala-container, .painel-oficina-container, .painel-geral-container').forEach(e => e.classList.remove('ativo-tela'));
        document.getElementById('area-motorista').style.display = 'none';

        if(modo === 'escala') {
            document.getElementById('tab-escala').classList.add('ativo');
            document.getElementById('area-escala').classList.add('ativo-tela');
            carregarMinhaEscala();
        } else if(modo === 'motorista') {
            document.getElementById('tab-motorista').classList.add('ativo');
            document.getElementById('area-motorista').style.display = 'block';
        } else if(modo === 'oficina') {
            document.getElementById('tab-oficina').classList.add('ativo');
            document.getElementById('painel-oficina').classList.add('ativo-tela');
        } else {
            document.getElementById('tab-controlador').classList.add('ativo');
            document.getElementById('painel-geral').classList.add('ativo-tela');
        }
    }

    function fazerLogout() { localStorage.clear(); location.reload(); }

    // --- FUNÇÕES DE ESCALA (CORRIGIDAS) ---

    function salvarEscalaIndividual() {
        const chapa = document.getElementById('escala-chapa').value;
        const nome = document.getElementById('escala-nome').value;
        const linha = document.getElementById('escala-linha').value;
        const data = document.getElementById('escala-data').value;
        const hora = document.getElementById('escala-horario').value;
        const obs = document.getElementById('escala-obs').value;

        if(!chapa || !data) return alert("Matrícula e Data são obrigatórios!");

        const idDoc = chapa + "_" + data;

        db.collection("escalas_motoristas").doc(idDoc).set({
            chapa: String(chapa), // IMPORTANTE: Sempre salvar como String
            motorista: nome,
            linha: linha,
            data: data,
            horario: hora,
            obs: obs // SALVANDO A OBSERVAÇÃO
        }).then(() => {
            mostrarToast("Escala salva com sucesso!", "sucesso");
            document.getElementById('escala-obs').value = "";
        }).catch(e => mostrarToast("Erro ao salvar", "erro"));
    }

    function carregarMinhaEscala() {
        const container = document.getElementById('dados-minha-escala');
        if(!usuarioChapaAtivo) return;

        db.collection("escalas_motoristas")
          .where("chapa", "==", String(usuarioChapaAtivo))
          .get()
          .then((snapshot) => {
            if(snapshot.empty) {
                container.innerHTML = "<p style='color:gray;'>Nenhuma escala lançada para você.</p>";
                return;
            }

            let html = "";
            snapshot.forEach(doc => {
                const e = doc.data();
                html += `
                <div style="background:var(--bg-input); padding:15px; border-radius:10px; margin-bottom:10px; border:1px solid var(--borda-card);">
                    <div style="font-size:16px; font-weight:bold; color:#34d399;">Linha: ${e.linha}</div>
                    <div style="font-size:13px; color:var(--texto-secundario); margin-top:4px;">Data: ${e.data} | Pegada: ${e.horario}</div>
                    
                    <!-- EXIBIÇÃO DA OBSERVAÇÃO (SE EXISTIR) -->
                    ${e.obs && e.obs.trim() !== "" ? `
                        <div class="caixa-recado">
                            <b style="color:#fbbf24; font-size:10px; text-transform:uppercase;">⚠️ Recado da Escala:</b>
                            <div style="color:#fff; font-size:14px; margin-top:4px;">${e.obs}</div>
                        </div>
                    ` : ""}
                </div>
