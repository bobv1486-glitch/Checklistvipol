<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>Check-list de Frota - Vipol</title>
    
    <!-- Scripts do Firebase (SDK v9 via compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <style>
        :root { 
            color-scheme: dark; 
            --bg-principal: #0f1117;
            --bg-card: #181c24;
            --bg-input: #12151c;
            --borda-card: #262c38;
            --azul-vipol: #1d4ed8;
            --azul-hover: #2563eb;
            --texto-principal: #f8fafc;
            --texto-secundario: #94a3b8;
            --sucesso: #059669;
            --alerta: #d97706;
            --perigo: #dc2626;
        }
        
        html, body {
            background-color: var(--bg-principal) !important;
            color: var(--texto-principal) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 120px;
            box-sizing: border-box;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        #toast-container {
            position: fixed;
            top: 64px; right: 14px; left: 14px;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: #1e2430;
            border-left: 4px solid #3b82f6;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            transition: opacity 0.3s ease;
        }

        .barra-navegacao-sistema {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(15, 17, 23, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--borda-card);
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            z-index: 10000;
        }

        .btn-navegacao {
            background: #181c24;
            color: var(--texto-secundario);
            border: 1px solid var(--borda-card);
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            display: none;
        }

        .btn-navegacao.ativo {
            background: var(--azul-vipol);
            color: #ffffff;
            border-color: #3b82f6;
        }

        body { padding-top: 60px; }

        .tela-login, .painel-geral-container, .painel-oficina-container, .area-escala-container {
            display: none;
        }

        .ativo-tela { display: flex !important; flex-direction: column; }

        .box-login {
            background: var(--bg-card);
            border: 1px solid var(--borda-card);
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 380px;
            margin: 50px auto;
            text-align: center;
        }

        .campo-login {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            margin-bottom: 14px;
        }

        .campo-login label { font-size: 11px; font-weight: 700; color: var(--texto-secundario); text-transform: uppercase; }

        .campo-login input, .campo-login select, .campo-login textarea {
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--borda-card);
            border-radius: 10px;
            color: #ffffff;
            outline: none;
        }

        .btn-acessar {
            width: 100%;
            background: var(--azul-vipol);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .card-painel {
            background: var(--bg-card);
            border: 1px solid var(--borda-card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .titulo-secao {
            font-size: 12px;
            font-weight: 800;
            color: #60a5fa;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Estilo da Observação na Escala do Motorista */
        .alerta-obs-motorista {
            margin-top: 12px;
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid #d97706;
            padding: 10px;
            border-radius: 8px;
            position: relative;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="barra-navegacao-sistema" id="barra-nav">
        <button class="btn-navegacao" id="tab-escala" onclick="mudarVisao('escala')">📅 Escala</button>
        <button class="btn-navegacao" id="tab-motorista" onclick="mudarVisao('motorista')">📱 Check-list</button>
        <button class="btn-navegacao" id="tab-oficina" onclick="mudarVisao('oficina')">🔧 Oficina</button>
        <button class="btn-navegacao" id="tab-controlador" onclick="mudarVisao('controlador')">📊 Painel</button>
    </div>

    <!-- TELA LOGIN -->
    <div id="tela-login" class="tela-login" style="display: flex;">
        <div class="box-login">
            <h2>Vipol Transportes</h2>
            <p>Acesse sua conta</p>
            <div class="campo-login">
                <label>Nome</label>
                <input type="text" id="login-nome">
            </div>
            <div class="campo-login">
                <label>Matrícula</label>
                <input type="number" id="login-chapa">
            </div>
            <div class="campo-login">
                <label>Cargo</label>
                <select id="login-cargo">
                    <option value="motorista">Motorista</option>
                    <option value="escalante">Escalante</option>
                    <option value="oficina">Oficina</option>
                    <option value="controlador">Controlador</option>
                </select>
            </div>
            <button class="btn-acessar" onclick="realizarLogin()">Entrar</button>
        </div>
    </div>

    <!-- AREA ESCALA -->
    <div id="area-escala" class="area-escala-container">
        <div style="text-align: right;"><button class="btn-logout" onclick="fazerLogout()">Sair</button></div>
        
        <div class="card-painel" id="bloco-minha-escala">
            <div class="titulo-secao">📋 Minha Próxima Escala</div>
            <div id="dados-minha-escala">Carregando...</div>
            <button onclick="carregarMinhaEscala()" style="margin-top:10px; background:transparent; border:1px solid #333; color:#aaa; font-size:10px; padding:5px; border-radius:5px;">🔄 Atualizar</button>
        </div>

        <div class="card-painel" id="bloco-cadastro-escala" style="display:none;">
            <div class="titulo-secao">✏️ Lançar Nova Escala</div>
            <div class="campo-login"><label>Matrícula Motorista</label><input type="number" id="escala-chapa"></div>
            <div class="campo-login"><label>Nome Motorista</label><input type="text" id="escala-nome"></div>
            <div class="campo-login"><label>Número da Linha</label><input type="text" id="escala-linha"></div>
            <div class="campo-login"><label>Data</label><input type="date" id="escala-data"></div>
            <div class="campo-login"><label>Horário</label><input type="text" id="escala-horario" placeholder="Ex: 04:30"></div>
            <div class="campo-login">
                <label>Observações para o Motorista</label>
                <textarea id="escala-obs" placeholder="Ex: Pegar carro reserva, Trocar no Brás, etc."></textarea>
            </div>
            <button class="btn-acessar" style="background:var(--sucesso)" onclick="salvarEscalaIndividual()">Salvar Escala</button>
        </div>
    </div>

    <!-- AREA MOTORISTA (CHECKLIST) -->
    <div id="area-motorista" style="display:none; padding:10px;">
        <div class="titulo-secao">✅ Realizar Check-list</div>
        <p>Selecione os itens e envie no final do turno.</p>
        <!-- Conteudo simplificado para teste -->
        <button class="btn-acessar" onclick="mostrarToast('Função em manutenção', 'aviso')">Iniciar Vistoria</button>
    </div>

<script>
    // CONFIGURAÇÃO FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyAcnlxdhZbAt9wtpVBhtSYGfMmvXBBMkRE",
      authDomain: "checklistvipol.firebaseapp.com",
      projectId: "checklistvipol",
      storageBucket: "checklistvipol.firebasestorage.app",
      messagingSenderId: "1083183148599",
      appId: "1:1083183148599:web:c3f6fcc48a72a8f03719b2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let usuarioChapaAtivo = "";
    let usuarioNomeAtivo = "";

    function mostrarToast(msg, tipo) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast';
        t.style.borderLeftColor = tipo === 'sucesso' ? '#059669' : '#d97706';
        t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function realizarLogin() {
        const nome = document.getElementById('login-nome').value;
        const chapa = document.getElementById('login-chapa').value;
        const cargo = document.getElementById('login-cargo').value;

        if(!nome || !chapa) return alert("Preencha tudo");

        localStorage.setItem("vipol_chapa", chapa);
        localStorage.setItem("vipol_nome", nome);
        localStorage.setItem("vipol_cargo", cargo);
        verificarSessao();
    }

    function verificarSessao() {
        const chapa = localStorage.getItem("vipol_chapa");
        const cargo = localStorage.getItem("vipol_cargo");
        if(chapa) {
            usuarioChapaAtivo = chapa;
            document.getElementById('tela-login').style.display = 'none';
            document.querySelectorAll('.btn-navegacao').forEach(b => b.style.display = 'inline-block');
            
            if(cargo === 'motorista') {
                mudarVisao('escala');
            } else if(cargo === 'escalante') {
                mudarVisao('escala');
                document.getElementById('bloco-cadastro-escala').style.display = 'block';
                document.getElementById('bloco-minha-escala').style.display = 'none';
            }
        }
    }

    function mudarVisao(modo) {
        document.querySelectorAll('.area-escala-container, #area-motorista').forEach(e => e.style.display = 'none');
        if(modo === 'escala') {
            document.getElementById('area-escala').style.display = 'block';
            carregarMinhaEscala();
        } else if(modo === 'motorista') {
            document.getElementById('area-motorista').style.display = 'block';
        }
    }

    function fazerLogout() { localStorage.clear(); location.reload(); }

    // --- SALVAR ESCALA (ESCALANTE) ---
    function salvarEscalaIndividual() {
        const chapa = document.getElementById('escala-chapa').value;
        const nome = document.getElementById('escala-nome').value;
        const linha = document.getElementById('escala-linha').value;
        const data = document.getElementById('escala-data').value;
        const horario = document.getElementById('escala-horario').value;
        const observacaoTexto = document.getElementById('escala-obs').value; // Captura a OBS

        if(!chapa || !data) return alert("Dados incompletos");

        const docID = chapa + "_" + data;

        db.collection("escalas_motoristas").doc(docID).set({
            chapa: String(chapa),
            motorista: nome,
            linha: linha,
            data: data,
            horario: horario,
            obs: observacaoTexto // SALVA NO FIREBASE
        }).then(() => {
            mostrarToast("Escala enviada com sucesso!", "sucesso");
            document.getElementById('escala-obs').value = "";
        }).catch(e => console.error(e));
    }

    // --- CARREGAR ESCALA (MOTORISTA) ---
    function carregarMinhaEscala() {
        const container = document.getElementById('dados-minha-escala');
        if(!usuarioChapaAtivo) return;

        db.collection("escalas_motoristas")
          .where("chapa", "==", String(usuarioChapaAtivo))
          .get()
          .then((snapshot) => {
            if(snapshot.empty) {
                container.innerHTML = "Nenhuma escala encontrada.";
                return;
            }

            let html = "";
            snapshot.forEach(doc => {
                const e = doc.data();
                
                html += `
                <div style="border:1px solid #333; padding:15px; border-radius:10px; margin-bottom:15px; background:#12151c">
                    <div style="font-size:16px; font-weight:bold; color:#34d399">Linha: ${e.linha}</div>
                    <div style="color:#aaa">Data: ${e.data} | Hora: ${e.horario}</div>
                    
                    <!-- LOGICA DA OBSERVAÇÃO -->
                    ${e.obs && e.obs.trim() !== "" ? `
                        <div class="alerta-obs-motorista">
                            <b style="color:#fbbf24; font-size:11px; text-transform:uppercase">⚠️ Recado do Escalante:</b><br>
                            <span style="font-size:14px; color:#fff">${e.obs}</span>
                        </div>
                    ` : ""}
                </div>
                `;
            });
            container.innerHTML = html;
          });
    }

    window.onload = verificarSessao;
</script>
</body>
</html>
